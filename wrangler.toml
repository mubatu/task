name = "task"
main = "worker/index.ts"
compatibility_date = "2026-09-16"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only API calls run the Worker; pages and scripts are served directly.
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "task"
database_id = "b89f037e-36ca-4be3-9f84-7252213a1211"
migrations_dir = "migrations"
